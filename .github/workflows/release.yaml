name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match package.json version
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - run: cargo test --workspace
      - run: bun run build:wasm
      - run: bun install --frozen-lockfile
      - parallel:
          - name: Lint
            run: bun run lint
          - name: Typecheck
            run: bun run typecheck
          - name: Test
            run: bun test src
      - run: bun run package
      - run: gh release create "${{ github.ref_name }}" ./*.vsix --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.VSCE_PAT != ''
        run: bunx vsce publish --no-dependencies --packagePath ./*.vsix --pat "$VSCE_PAT"
