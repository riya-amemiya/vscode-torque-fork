name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check format
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: bun run build:wasm
      - parallel:
          - name: Lint
            run: bun run lint
          - name: Format
            run: bun run format:check
          - name: Typecheck
            run: bun run typecheck
          - name: Compile
            run: bun run bundle
          - name: Test
            run: bun test src
      - name: Package
        run: bun run package
      - name: VSIX must not contain source maps
        run: |
          if unzip -Z1 ./*.vsix | grep -E '\.map$'; then
            echo "Source maps must not be packaged in the VSIX" >&2
            exit 1
          fi
      - name: VSIX must contain the Torque WASM compiler
        run: |
          if ! unzip -Z1 ./*.vsix | grep -E 'torque_compiler\.wasm$'; then
            echo "torque_compiler.wasm must be packaged in the VSIX" >&2
            exit 1
          fi
