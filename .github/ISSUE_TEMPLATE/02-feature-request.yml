name: Feature request
description: Suggest an improvement to this Torque editor extension.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a change. Please open an issue before starting a
        large implementation. This fork is not affiliated with Google or the V8 project.
  - type: checkboxes
    id: existing
    attributes:
      label: Is there an existing issue for this?
      description: Please search [existing issues](https://github.com/riya-amemiya/vscode-torque-fork/issues) first.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Go to definition
        - Completions and snippets
        - Syntax diagnostics
        - Hover
        - Document outline
        - Native torque-language-server
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should this extension do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including keeping the current behavior.
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/riya-amemiya/vscode-torque-fork/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
