[workspace]
members = [
  "crates/torque-ast",
  "crates/torque-check",
  "crates/torque-compiler",
  "crates/torque-diagnostic",
  "crates/torque-lexer",
  "crates/torque-parser",
  "crates/torque-span",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
torque-ast = {path = "crates/torque-ast"}
torque-check = {path = "crates/torque-check"}
torque-diagnostic = {path = "crates/torque-diagnostic"}
torque-lexer = {path = "crates/torque-lexer"}
torque-parser = {path = "crates/torque-parser"}
torque-span = {path = "crates/torque-span"}
wasm-bindgen = "0.2.129"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
